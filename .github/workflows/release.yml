name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-tauri:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        if: startsWith(matrix.platform, 'macos')
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Rust stable
        if: matrix.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Sync application version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: bun run version:sync "$GITHUB_REF_NAME"

      - name: Build and upload Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('preview-{0}', github.run_number) }}
          releaseName: Congmiao Toolbox ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('preview-{0}', github.run_number) }}
          releaseBody: Desktop preview build generated by GitHub Actions.
          releaseDraft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  verify-updater:
    name: Verify updater manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download and validate latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir updater-verification
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir updater-verification
          VERSION="${GITHUB_REF_NAME#v}"
          jq --exit-status --arg version "$VERSION" '
            .version == $version and
            (.platforms | length >= 3) and
            all(.platforms[]; (.url | length > 0) and (.signature | length > 0))
          ' updater-verification/latest.json
